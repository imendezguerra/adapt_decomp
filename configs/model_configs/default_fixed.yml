# General
fs: 2048                          # Sampling frequency (Hz)
device: null                      # Compute device: null (auto), "cpu", "cuda", "mps"

# Preprocessing
lowcut: 20.0                      # High-pass cutoff (Hz)
highcut: 500.0                    # Low-pass cutoff (Hz)
powerline: true                   # Remove powerline artefact
powerline_freq: 50.0              # Powerline frequency (Hz)

# Decomposition
ext_fact: 10                      # Time-delay embedding: D = channels × ext_fact

# Adaptation flags — all disabled: run fixed calibration model without updating
batch_ms: 100                     # Batch duration (ms); batch_size = batch_ms × fs / 1000
adapt_wh: false                   # Do not adapt whitening matrix V
adapt_sv: false                   # Do not adapt separation matrix B
adapt_sd: false                   # Do not adapt spike / base centroids
compute_loss: true                    # Log wh_loss, sv_loss, centroid_loss, wh_trace each batch

# Step-size (learning rate; unused when adapt_wh/sv are false). The clip ceiling
# is now derived automatically as safety_clip_multiplier_{wh,sv} * wh_learning_rate/sv_learning_rate (Config
# defaults), not set here.
wh_learning_rate: 5.0e-3                      # Whitening learning rate
sv_learning_rate: 1.0e-3                      # Separation-vector learning rate

# Whitening
wh_mode: kl_to_identity           # KL target: "kl_to_identity" or "kl_to_cal"
wh_b_coupling: false              # Propagate V-step frame correction to B
shrinkage: 1.0e-3                 # Ledoit-Wolf shrinkage on FIFO covariance
fifo_length: 0                    # FIFO samples for covariance (0 = auto: 2×D)
max_sigma_batches: 300            # Max calibration windows for sigma_K estimation (0 = all)

# Source separation
contrast_scope: batch_based       # "batch_based" or "spike_based"
sv_epochs: 1                     # Fixed-point iterations per batch for B
sv_tol: 1.0e-4                     # Early-exit threshold: ||ΔB||_F / ||B||_F < sv_tol

# Spike detection
spike_dist_ms: 10                 # Minimum inter-spike interval for NMS (ms)
source_fifo_batches: 2            # Past batches of Y prepended for left-edge NMS context

# Centroid adaptation (inactive when adapt_sd is false)
centroid_momentum: 0.95           # EMA momentum for centroid updates (0 = no memory)

# Debug
debug: false                      # Store per-batch diagnostics in outputs["diagnostics"]
