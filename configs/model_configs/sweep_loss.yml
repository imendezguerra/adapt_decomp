method: "bayes"  # Bayesian optimization for efficient searching
metric:
  name: "total_loss"
  goal: "minimize"
parameters:
  lr_v:
    min: 1.0e-4
    max: 5.0e-2
  lr_b:
    min: 1.0e-4
    max: 1.0e-2
early_terminate: # Early stopping configuration
  type: hyperband
  min_iter: 5
  max_iter: 50
  s: 2