[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The configs shipped with the package (AdaptConfig.from_preset)
[tool.setuptools.package-data]
"adapt_decomp.adaptation" = ["presets/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "adapt_decomp.__version__"}

[project]
name = "adapt_decomp"
dynamic = ["version"]
description = "Adaptive EMG decomposition in dynamic conditions based on online learning metrics with tunable hyperparameters"
authors = [{ name = "Irene Mendez Guerra", email = "irene.mendez17@imperial.ac.uk" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "EMG",
    "HD-EMG",
    "motor unit",
    "decomposition",
    "blind source separation",
    "online learning",
    "adaptive",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Lower bounds only -- the exact, reproducible versions live in environment.yaml.
# Keep in sync with environment.yaml and ci/constraints-min.txt (checked by
# ci/check_deps_sync.py in pre-commit and CI).
dependencies = [
    "h5py>=3.10",
    "matplotlib>=3.8",
    "numpy>=1.26,<2.0.0",
    "scipy>=1.11.1",
    "seaborn>=0.13",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "joblib>=1.3",             # Parallel(return_as="generator"), used by the notebooks
    "psutil>=5.9",             # memory check before an optimize_adapt_decomp search
    "pyyaml>=6.0",
    "torch>=2.7",              # pip version (CPU by default); 2.7 adds slogdet on MPS
    "optuna>=3.5",
    "cmaes>=0.10",             # required by optuna.samplers.CmaEsSampler
    "loguru>=0.7",
    "plotly>=5.18",
    "tqdm>=4.66",
    "typer>=0.12",             # the adapt-decomp and adapt-decomp-data commands
]

[project.urls]
Homepage = "https://imendezguerra.github.io/adapt_decomp/"
Documentation = "https://imendezguerra.github.io/adapt_decomp/"
Source = "https://github.com/imendezguerra/adapt_decomp"
Issues = "https://github.com/imendezguerra/adapt_decomp/issues"
Changelog = "https://imendezguerra.github.io/adapt_decomp/changelog/"

[project.scripts]
adapt-decomp = "adapt_decomp.cli:app"
adapt-decomp-data = "adapt_decomp.utils.download:app"   # alias of adapt-decomp data

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3", "ipykernel>=6.29"]
# Logging adaptations and searches to wandb: adapt-decomp optimize_adapt_decomp --wandb_project, wandb_sweep
wandb = ["wandb>=0.16.4"]
# The documentation site (mkdocs.yml): mkdocs build --strict
docs = [
    "mkdocs>=1.6,<2",          # MkDocs 2 drops the plugin system the site relies on
    "mkdocs-material>=9.6",
    "mkdocstrings>=1.0",
    "mkdocstrings-python>=2.0",
    "mkdocs-jupyter>=0.25",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "."]   # "." makes benchmarks/ first-party
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]
# E501: the formatter owns line length (long strings/comments are left alone).
# RUF001-003: Greek letters and maths symbols in strings/comments are intentional.
ignore = ["E741", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Import order in package __init__ files is load-bearing (avoids circular imports).
"__init__.py" = ["I001", "RUF022"]
# How-to snippets: each section brings its own imports, since a page shows only that section.
"docs/snippets/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: integration-style tests (Optuna searches, multi-batch adaptation loops, the FDSI benchmark stages) -- excluded by `pytest -m \"not slow\"`",
    "repro: cross-platform reproducibility test on the NeuroMotion tutorial data (needs `make data`) -- run with `pytest -m repro`",
]
