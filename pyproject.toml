[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "adapt_decomp"
version = "2.0.0"
description = "Adaptive EMG decomposition in dynamic conditions based on online learning metrics with tunable hyperparameters"
authors = [{ name = "Irene Mendez Guerra", email = "irene.mendez17@imperial.ac.uk" }]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "h5py",
    "matplotlib",
    "numpy<2.0.0",
    "scipy",
    "seaborn",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "pytest",
    "ipykernel",
    "torch",                   # pip version (CPU by default)
    "wandb",
    "optuna",
    "cmaes",                   # required by optuna.samplers.CmaEsSampler
    "loguru",
    "plotly",
    "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration-style tests (Optuna studies, multi-batch adaptation loops) -- excluded by `pytest -m \"not slow\"`",
]
