# Documentation: built on every PR and push to main (to catch errors),
# deployed to GitHub Pages only on a release (or a manual run), so the site matches the
# latest release on PyPI.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # CPU-only torch wheels: avoids downloading ~2 GB of CUDA libraries on Linux.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with docs extras
        run: |
          python -m pip install torch --index-url ${{ env.TORCH_INDEX }}
          python -m pip install -e ".[docs]"
      # Notebooks are rendered from their stored outputs (execute: false), so no data is needed
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
