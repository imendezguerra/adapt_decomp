# Release pipeline: full test suite -> build wheel + sdist -> upload -> attach files to the release.
#
#   * Publishing a GitHub release uploads to PyPI (after manual approval of the `pypi` environment).
#   * Running this workflow by hand (Actions -> publish -> Run workflow) uploads to TestPyPI,
#     to rehearse a release without touching the real index.
#
# Uploads use PyPI Trusted Publishing (OIDC): no API token is stored in the repository.
# One-off setup and the release checklist are in .github/RELEASING.md.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: Full CI suite
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check release tag matches the package, citation and changelog versions
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          ls dist/adapt_decomp-"${version}"-*.whl \
            || { echo "::error::Tag $TAG does not match __version__ in src/adapt_decomp/__init__.py"; exit 1; }
          grep -qx "version: ${version}" CITATION.cff \
            || { echo "::error::Tag $TAG does not match the version in CITATION.cff"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [${version}]' section"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/adapt-decomp
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/adapt-decomp
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    name: Attach files to the GitHub release
    if: github.event_name == 'release'
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
