# Install locally with:  pre-commit install   (sets up both pre-commit and pre-push hooks)
# Run on everything:     pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]

exclude: ^notebooks/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^mkdocs\.yml$   # its mermaid fence needs a !!python/name tag
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: \.ipynb$   # notebooks keep their outputs, which the docs render
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # Python only: ruff also formats Markdown code blocks, which breaks the docs'
        # snippet markers (--8<-- "file.py:section")
        types_or: [python, pyi]

  - repo: local
    hooks:
      # pyproject.toml (ranges), environment.yaml (exact pins) and
      # ci/constraints-min.txt (lower bounds) must describe the same dependencies.
      - id: check-deps-sync
        name: check dependency specs are in sync
        entry: python ci/check_deps_sync.py
        language: python
        additional_dependencies: [pyyaml, tomli, packaging]
        files: ^(pyproject\.toml|environment\.yaml|ci/constraints-min\.txt|ci/check_deps_sync\.py)$
        pass_filenames: false

      # Tests run on push (not every commit) to keep commits fast. Slow tests and
      # the data-dependent reproducibility test run in CI.
      - id: pytest
        name: pytest
        entry: python -m pytest -m "not slow and not repro"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
