# Documentation site: mkdocs serve (live preview) | mkdocs build --strict (as in CI).
# Needs the docs extra: pip install -e ".[docs]" (or environment.yaml).

site_name: adapt_decomp
site_description: Adaptive EMG decomposition in dynamic conditions based on online learning metrics with tunable hyperparameters
site_url: https://imendezguerra.github.io/adapt_decomp/
repo_url: https://github.com/imendezguerra/adapt_decomp
repo_name: imendezguerra/adapt_decomp
edit_uri: edit/main/docs/
copyright: Copyright &copy; Irene Mendez Guerra, MIT licence

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs/snippets"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
  - mkdocs-jupyter:
      execute: false
      include_source: true

# Files outside docs/ that mkdocs serve also live-reloads on
watch:
  - README.md
  - CHANGELOG.md
  - src

# Notebooks that live outside docs/ (benchmarks/, notebooks/) are added by this hook
hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  snippets/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - API Concepts:
      - Overview: guide/overview.md
      - Calibration: guide/calibration.md
      - Adaptation: guide/adaptation.md
      - Hyperparameter optimisation: guide/optimisation.md
  - User guide:
      - how-to/index.md
      - Calibrate a recording: how-to/calibrate-a-recording.md
      - Adapt from the calibration end: how-to/adapt-from-calibration-end.md
      - Tune hyperparameters: how-to/tune-hyperparameters.md
      - Evaluate against ground truth: how-to/evaluate-against-ground-truth.md
      - Plot results: how-to/plot-results.md
      - Process online: how-to/process-online.md
      - Use the command line: how-to/use-the-command-line.md
      - Run on a cluster: how-to/run-on-a-cluster.md
  - Examples:
      - "Paper example: NeuroMotion wrist staircase": notebooks/original_tutorial/adaptive_emg_decomp_dyn_example.ipynb
  - FDSI benchmark:
      - Overview: benchmarks/fdsi.md
      - 0. Dataset: benchmarks/fdsi/0_dataset.ipynb
      - 1. Calibration: benchmarks/fdsi/1_calibrate.ipynb
      - 2. Search: benchmarks/fdsi/2_search.ipynb
      - 3. Apply: benchmarks/fdsi/3_apply.ipynb
      - 4. Results: benchmarks/fdsi/4_results.ipynb
      - Running the benchmark: benchmarks/fdsi/running.md
  - API reference:
      - reference/index.md
      - Calibration (cbss): reference/cbss.md
      - Adaptation: reference/adaptation.md
      - Optimisation: reference/optimisation.md
      - Preprocessing: reference/preprocessing.md
      - Spikes: reference/spikes.md
      - Utilities: reference/utils.md
  - Changelog: changelog.md
